<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family:"Bebas Neue"; src:url("__FONTDIR__/BebasNeue-Regular.ttf"); }
@font-face { font-family:"IBM Plex Mono"; src:url("__FONTDIR__/IBMPlexMono-Regular.ttf"); font-weight:400; }
@font-face { font-family:"IBM Plex Mono"; src:url("__FONTDIR__/IBMPlexMono-SemiBold.ttf"); font-weight:600; }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1920px; height:1080px; overflow:hidden; }
body { background:#08090C; color:#F1F3F5;
  font-family:"IBM Plex Mono","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }
#app { width:100%; height:100%; display:flex; flex-direction:column;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:48px 48px; }
.accent { color:#00D66B; }
.dim { color:#7D8796; }

/* ---- 顶部 ---- */
.hd { flex:none; height:96px; display:flex; align-items:center;
  justify-content:space-between; padding:0 64px; border-bottom:1px solid #272D36; }
.hd .l { display:flex; flex-direction:column; gap:6px; }
.hd .t1 { font-family:"Bebas Neue"; font-size:46px; line-height:1; letter-spacing:3px; }
.hd .t1 .g { color:#00D66B; }
.hd .t2 { font-size:14px; letter-spacing:4px; color:#7D8796; }
.hd .r { display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
.hd .d1 { font-family:"Bebas Neue"; font-size:34px; line-height:1; letter-spacing:2px; }
.hd .d1 .arr { color:#3A4250; padding:0 10px; }
.hd .d2 { font-size:14px; letter-spacing:2px; color:#7D8796; }
.hd .d2 b { color:#F1F3F5; font-weight:600; }

/* ---- 单一赛事横幅（全部比赛同赛事时才出现）---- */
.evb { flex:none; height:44px; display:flex; align-items:center; gap:16px;
  padding:0 64px; border-bottom:1px solid #272D36; background:rgba(21,26,34,.45); }
.evb .nm { font-family:"Bebas Neue"; font-size:24px; letter-spacing:2px; color:#F1F3F5; }
.evb .ln { flex:1; height:1px; background:#272D36; }
.evb .ct { font-size:13px; letter-spacing:3px; color:#7D8796; }

/* ---- 赛程主体 ---- */
.bd { flex:1; min-height:0; display:flex; gap:56px; padding:20px 64px; }
.col { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }

/* 日期分隔 */
.sep { flex:none; display:flex; align-items:center; gap:18px; margin:10px 0; }
.sep .ln { flex:1; height:1px; background:#272D36; }
.sep .tx { font-size:14px; letter-spacing:3px; color:#7D8796; white-space:nowrap; }
.sep .tx b { color:#00D66B; font-weight:600; }

/* 比赛行 */
.mrow { flex:none; display:flex; align-items:center; border-radius:12px;
  background:#11151C; border:1px solid #272D36; padding:0 26px 0 22px; margin:5px 0; }
.mrow .tt { flex:none; width:118px; font-weight:600; color:#F1F3F5;
  letter-spacing:1px; line-height:1; }
.mrow .nd { flex:none; width:34px; font-size:12px; letter-spacing:1px;
  color:#00D66B; line-height:1.15; margin-left:8px; }
.mrow .tick { flex:none; width:3px; height:56%; background:#00D66B; border-radius:2px;
  margin-right:24px; opacity:.85; }
.mrow .mu { flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
.mrow .l1 { display:flex; align-items:center; gap:14px; min-width:0; }
.mrow .lg { flex:none; height:36px; width:44px; display:flex; align-items:center;
  justify-content:center; }
.mrow .lg img { max-height:36px; max-width:44px; object-fit:contain; }
.mrow .lg.ph { font-family:"Bebas Neue"; font-size:20px; color:#7D8796;
  border:1px solid #272D36; border-radius:6px; height:36px; width:36px;
  display:flex; align-items:center; justify-content:center; }
.mrow .tn { font-family:"Bebas Neue"; letter-spacing:1.5px; line-height:1;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.mrow .vs { flex:none; font-size:15px; letter-spacing:2px; color:#5C6570; padding:0 4px; }
.mrow .l2 { font-size:14px; letter-spacing:1px; color:#7D8796; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; }
.mrow .bo { flex:none; margin-left:20px; font-size:14px; font-weight:600;
  letter-spacing:1px; color:#7D8796; border:1px solid #272D36; border-radius:5px;
  padding:4px 12px; }
.mrow .lv { flex:none; display:flex; align-items:center; gap:7px; margin-left:20px;
  font-size:13px; font-weight:600; letter-spacing:2px; color:#00D66B; }
.mrow .lv .dot { width:8px; height:8px; border-radius:50%; background:#00D66B; }

/* ---- 页脚 ---- */
.ftr { flex:none; height:46px; display:flex; align-items:center;
  justify-content:space-between; padding:0 64px; border-top:1px solid #272D36;
  font-size:13px; letter-spacing:1px; color:#5C6570; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const daily = __DAILY__;

function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

// 三档密度：行高 / 队名字号 / 时间字号 / 事件行字号
function density(rowsPerCol){
  if (rowsPerCol <= 8)  return {rh:88, tn:34, tt:30, l2:14, lg:36};
  if (rowsPerCol <= 11) return {rh:70, tn:27, tt:25, l2:13, lg:30};
  return                  {rh:58, tn:22, tt:20, l2:13, lg:26};
}

function logoHtml(t, lg){
  if (t.logo) return `<div class="lg"><img src="${t.logo}"></div>`;
  const ini = esc((t.short||t.name||"?")[0]);
  return `<div class="lg ph">${ini}</div>`;
}

function rowHtml(m, D, hideEvent){
  const tnFs = `font-size:${D.tn}px`;
  const a = m.teamA, b = m.teamB;
  const live = m.status === "LIVE";
  const l2 = hideEvent ? "" :
    `<div class="l2" style="font-size:${D.l2}px">${esc(m.event || "")}</div>`;
  return `<div class="mrow" style="height:${D.rh}px">
    <div class="tt" style="font-size:${D.tt}px">${esc(m.time)}</div>
    ${m.day > 0 ? `<div class="nd">次日</div>` : ""}
    <div class="tick"></div>
    <div class="mu">
      <div class="l1">
        ${logoHtml(a, D)}
        <span class="tn" style="${tnFs}">${esc(a.short || a.name)}</span>
        <span class="vs">VS</span>
        <span class="tn" style="${tnFs}">${esc(b.short || b.name)}</span>
        ${logoHtml(b, D)}
      </div>
      ${l2}
    </div>
    ${live ? `<div class="lv"><span class="dot"></span>LIVE</div>`
           : (m.bo ? `<div class="bo">${esc(m.bo)}</div>` : "")}
  </div>`;
}

function sepHtml(label, next){
  return `<div class="sep"><div class="ln"></div>
    <div class="tx">${next ? `<b>${esc(label)}</b> · NEXT DAY` : esc(label)}</div>
    <div class="ln"></div></div>`;
}

// 把一场序列切进一列：day 变化处插日期分隔
function columnHtml(list, D, hideEvent, colStartDay){
  let html = "", curDay = colStartDay;
  for (const m of list){
    if (m.day !== curDay){
      curDay = m.day;
      html += sepHtml(m.dateLabel || "", true);
    }
    html += rowHtml(m, D, hideEvent);
  }
  return html;
}

function render(d){
  const ms = d.matches.slice().sort((x,y)=>x.ts-y.ts);
  const n = ms.length;
  const app = document.getElementById("app");

  // 赛事统计；全部同赛事 → 顶部横幅 + 行内不重复
  const events = [...new Set(ms.map(m=>(m.event||"").trim()).filter(Boolean))];
  const singleEvent = events.length === 1 ? events[0] : "";

  // 两列：>8 场。切分点优先「跨午夜处」，否则中间。
  let cols;
  if (n <= 8){
    cols = [ms];
  } else {
    let k = Math.ceil(n/2);
    for (let i=1;i<n;i++){
      if (ms[i].day !== ms[i-1].day && Math.abs(i-(n-i)) <= Math.abs(k-(n-k))) k = i;
    }
    cols = [ms.slice(0,k), ms.slice(k)];
  }
  const rowsPerCol = Math.max(...cols.map(c=>c.length));
  const D = density(rowsPerCol);
  const hideEvent = !!singleEvent;

  const banner = singleEvent ? `
    <div class="evb">
      <span class="ct">TOURNAMENT</span>
      <span class="nm">${esc(singleEvent)}</span>
      <div class="ln"></div>
    </div>` : "";

  const body = `<div class="bd">` + cols.map((c,i)=>{
    const startDay = c.length ? c[0].day : 0;
    return `<div class="col">${columnHtml(c, D, hideEvent, startDay)}</div>`;
  }).join("") + `</div>`;

  app.innerHTML = `
    <div class="hd">
      <div class="l">
        <div class="t1">CS2 <span class="g">DAILY</span> MATCHES</div>
        <div class="t2">TODAY'S SCHEDULE</div>
      </div>
      <div class="r">
        <div class="d1">${esc(d.dateLabel)}<span class="arr">→</span>${esc(d.endDateLabel)}</div>
        <div class="d2">${esc(d.windowLabel)} &nbsp;·&nbsp; <b>${n}</b> MATCHES &nbsp;·&nbsp; <b>${events.length}</b> EVENT${events.length===1?"":"S"}</div>
      </div>
    </div>
    ${banner}${body}
    <div class="ftr">
      <span>DATA SOURCE: LIQUIPEDIA</span>
      <span>LAST UPDATED ${esc(d.generatedAt||"")} · GENERATED BY DOUYU-LIVE-NOTIFY</span>
    </div>`;
}
render(daily);
</script>
</body>
</html>
