# NapCatQQ —— 只为 douyu-live-notify 服务的 OneBot 实现
#
# ⚠️ 安全红线（务必照抄，不要改成 0.0.0.0）
#   1. 端口只发布到 127.0.0.1 —— 公网访问不到。就算云安全组配错了也炸不出去。
#   2. 绝不用默认/空 token。
#   3. 用 QQ 小号，不要用主号。
#   背景：2025-09 有人批量扫描「暴露在公网 + 默认 token」的 NapCat，
#        拿它去大量 QQ 群发违法信息，导致被波及的账号和群聊被**永久封禁**。
#
# 用法：
#   把本文件和同目录的 .env 一起放到 /opt/napcat/，然后：
#     cd /opt/napcat && docker compose up -d
#     docker compose logs --tail=50
#   （.env 里已经生成好了 WEBUI_TOKEN，不用自己改）

services:
  napcat:
    # 国内服务器拉不动 Docker Hub 时，换成镜像源，例如：
    #   image: docker.1ms.run/mlikiowa/napcat-docker:latest
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always

    # ── 内存安全网（小内存机器务必看这段，>4GB 的机器可以删掉）────────────
    # 容器里跑的是**完整的 QQ NT（Electron）**，实测常驻 300~700MB。
    # 官方首页说「内存低至 50~100MB」，那指的是 NapCat 自身框架层，
    # 不含它承载的 QQ NT 进程 —— 别按 50MB 做容量规划。
    #
    # 这里设上限**不是为了省内存**，而是为了决定「内存失控时谁死」：
    #
    #   不设上限 → NapCat 吃满宿主机内存，触发**全局** OOM killer。
    #              全局 OOM 按 RSS 从大到小挑牺牲品，很可能杀掉你的个人网页。
    #
    #   设了上限 → 内核只在**这个容器的 cgroup 内部**杀进程。
    #              NapCat 自己重启（restart: always），网页毫发无损。
    #
    # ⚠️ 那道上限**必须 ≤ 宿主机可用内存**，否则等于没设：
    #    机器只剩 800MB 可用、上限却写 900m，容器照样能一个人吃光内存，
    #    又把宿主机拖进全局 OOM。这是最容易搞反的一点。
    #
    # 默认 700m。按下面这个公式在 .env 里改（NAPCAT_MEM_LIMIT），别改本文件：
    #     上限 ≈ 宿主机可用内存 × 0.8   （留 20% 给系统和其他服务）
    #   可用 800MB → 700m ／ 可用 1.5GB → 1200m ／ 可用 3GB → 2000m
    # 部署稳定几天后，照 docker stats 的实测峰值再收紧或放宽。
    #
    # ⚠️ 部署后**必须验证它真的生效**（返回 0 说明没生效，需要改用 mem_limit 写法）：
    #      docker inspect napcat --format '{{.HostConfig.Memory}}'
    #      700m → 734003200
    deploy:
      resources:
        limits:
          memory: "${NAPCAT_MEM_LIMIT:-700m}"

    environment:
      # 机器人 QQ 号。
      # 镜像的 entrypoint 靠它决定用哪种登录方式：
      #     if [ -n "${ACCOUNT}" ]; then  qq --no-sandbox -q $ACCOUNT   # 快速登录（免扫码）
      #     else                          qq --no-sandbox               # 退回扫二维码
      # 不填 → 容器每次重启都可能退回等你扫码，做不到长期无人值守。
      # 首次登录填了也没关系：-q 找不到可用会话时照样出二维码给你扫。
      # 这里用 :? 让它成为必填项 —— 漏填时 compose 直接拒绝启动，
      # 而不是悄悄退回扫码（那种失败你几天后才会发现）。
      ACCOUNT: "${ACCOUNT:?missing ACCOUNT - 在 .env 里填机器人 QQ 号，否则重启会退回扫码}"
      # 用宿主机当前用户身份运行，避免挂载目录出现权限问题。
      # 在 .env 里写 NAPCAT_UID=$(id -u) / NAPCAT_GID=$(id -g)
      NAPCAT_UID: "${NAPCAT_UID:-0}"
      NAPCAT_GID: "${NAPCAT_GID:-0}"
      # WebUI 登录密码。
      # 这里的 :? 是故意的：如果 .env 没放到位，compose 会直接报错退出，
      # 而不是悄悄用默认值跑起来（默认值 + 公网 = 2025 年那次封号事件的成因）。
      WEBUI_TOKEN: "${WEBUI_TOKEN:?missing WEBUI_TOKEN - did you copy the .env file ?}"

    ports:
      # 冒号左边写 127.0.0.1，就是「只绑回环地址」：
      # 宿主机上的 watch.py 连得上，公网连不上。
      - "127.0.0.1:3000:3000"   # OneBot v11 正向 HTTP —— watch.py 用它发消息
      - "127.0.0.1:6099:6099"   # WebUI —— 扫码登录、看日志、改配置
    # 3001 是 WebSocket，本方案不用，刻意不发布

    volumes:
      - ./napcat/config:/app/napcat/config   # NapCat 自身配置（含 onebot11_<QQ号>.json）
      - ./ntqq:/app/.config/QQ               # QQ 登录态，容器重启免重新扫码
      - ./napcat/logs:/app/napcat/logs       # 运行日志
